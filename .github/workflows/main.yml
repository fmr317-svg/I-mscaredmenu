name: Build Imscared APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Imscared-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

### Step 3: Save the changes
1. Tap **Commit changes**.
2. Confirm the commit.
3. Open **Actions**.
4. Tap the newest **Build Imscared APK** run.

### Step 4: Tell me what happens
- ✅ **Green check:** The build succeeded.
- ❌ **Red X:** Open the failed run and send me a screenshot of the error.

**Important:** This fixes the YAML indentation error. We may still need to fix the Gradle build if the project is missing files or has other configuration errors.
